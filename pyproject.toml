[project]
name = "kanon"
version = "0.1.0"
description = "Policy-adherent decisions for AI agents: deterministic three-valued rule evaluation over atomic facts answered by code, LLMs or humans."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Roan Brasil" }]
dependencies = ["pydantic>=2.5", "pyyaml>=6.0"]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
bench = ["matplotlib>=3.8"]
dev = ["pytest>=8", "matplotlib>=3.8"]

[project.scripts]
kanon = "kanon.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
